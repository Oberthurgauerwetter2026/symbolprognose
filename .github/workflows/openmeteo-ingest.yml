name: Open-Meteo Cache Ingest

on:
  # Schedule entfernt — der Cloudflare-Worker (cron-worker/) triggert
  # diesen Workflow zuverlässig via workflow_dispatch.
  # GitHub `schedule:` wurde wiederholt von GitHub verworfen.
  workflow_dispatch: {}

concurrency:
  group: openmeteo-ingest
  cancel-in-progress: false

# Gemeinsame Gitter-/Abrufparameter. MÜSSEN in fetch und publish identisch
# sein, sonst passen die Shards nicht zum Raster (merge bricht dann ab).
env:
  CHUNK_PHASE1: "60"
  CHUNK_PHASEC: "60"
  BATCH_SLEEP_S: "12"
  OM_CONNECT_TIMEOUT: "30"
  OM_READ_TIMEOUT: "60"
  FETCH_WORKERS: "1"
  BBOX_MIN_LAT: "46.6"
  BBOX_MAX_LAT: "48.6"
  BBOX_MIN_LON: "7.4"
  BBOX_MAX_LON: "11.6"
  # Sparse-Grid (Wind, Bias, phase2/phaseC) — bleibt bewusst grob.
  GRID_LAT: "22"
  GRID_LON: "36"
  # Dense-Grid für die Prognose-PNGs (66×96 = 6336 Punkte). Zu viel für das
  # Open-Meteo-Stundenlimit einer IP (5000) — darum auf SHARD_COUNT Runner
  # verteilt (~2100 Punkte je Runner).
  GRID_LAT_DENSE: "66"
  GRID_LON_DENSE: "96"
  SHARD_COUNT: "3"
  # Streng: eine lückenhafte Prognose darf nie publiziert werden.
  PHASE1_DENSE_MAX_FAIL_PCT: "1"
  FORECAST_MAX_MISSING_PCT: "1"
  RETRY_BATCH_SLEEP_S: "25"
  # phaseA (Symbolprognose) läuft nur 4× täglich via openmeteo-symbol.yml
  SKIP_PHASEA: "1"

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: true
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: python -m pip install requests boto3

      - name: Fetch phase1 shard ${{ matrix.shard }}
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_OUT_DIR: shards
        run: python -u scripts/ingest_openmeteo.py

      - uses: actions/upload-artifact@v4
        with:
          name: phase1-shard-${{ matrix.shard }}
          path: shards/phase1_shard_${{ matrix.shard }}.json
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: fetch
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          # Pillow + numpy für die Prognose-PNG-Rasterung.
          python -m pip install boto3 requests numpy Pillow

      - uses: actions/download-artifact@v4
        with:
          pattern: phase1-shard-*
          path: shards

      - name: Merge shards, render and publish
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          MERGE_SHARDS_DIR: shards
        run: python -u scripts/ingest_openmeteo.py
