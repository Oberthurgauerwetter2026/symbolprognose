name: Blitzortung Ingest

on:
  # Trigger ausschliesslich via Cloudflare Worker (cron-worker/) alle 5 min.
  # GitHub `schedule:` entfernt — wurde wiederholt verworfen (Daten wurden
  # stundenweise alt).
  workflow_dispatch: {}


concurrency:
  group: blitzortung-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/requirements.txt
          python -m pip install "websockets>=12,<14"
      - name: Run ingest
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          BO_LISTEN_S: "280"
        run: python -u scripts/ingest_blitzortung.py
