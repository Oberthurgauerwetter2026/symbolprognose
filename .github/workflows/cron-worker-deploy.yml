name: Deploy cron-worker

on:
  push:
    branches: [main]
    paths:
      - "cron-worker/**"
      - ".github/workflows/cron-worker-deploy.yml"
  # Sicherheitsnetz: falls ein Push den Deploy nicht auslöst, wird der Worker
  # spätestens täglich neu deployt (sonst laufen neue Trigger-Vars nie live).
  schedule:
    - cron: "10 3 * * *"
  workflow_dispatch: {}


concurrency:
  group: cron-worker-deploy
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Verhindert, dass GitHub den Zeitplan nach 60 Tagen ohne Commits
      # deaktiviert (API-basiert, erzeugt keine Commits).
      - name: Keepalive
        if: github.event_name == 'schedule'
        uses: gautamkrishnar/keepalive-workflow@v2
        continue-on-error: true


      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        working-directory: cron-worker
        run: bun install

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          workingDirectory: cron-worker
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4"
          command: deploy --config wrangler.toml
